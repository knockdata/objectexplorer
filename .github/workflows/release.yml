name: Release

# Push a version tag (git tag v1.2.3 && git push origin v1.2.3) to build installers for
# every platform and publish them as a GitHub Release. The product itself comes from the
# objectexplorer npm package, so nothing is compiled here — each job just installs and packs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.2.3"
        required: true

jobs:
  mac:
    runs-on: macos-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Set version
        run: bash .github/set-version.sh "${{ inputs.version || github.ref_name }}"
      - run: npm install --no-audit --no-fund

      - name: Import signing certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Write App Store Connect API key
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          echo "$PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      # signed + notarized when the cert secret is present, plain unsigned build otherwise
      - name: Build signed
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: npx electron-builder --mac --x64 --arm64 --publish never
      - name: Build unsigned
        if: env.BUILD_CERTIFICATE_BASE64 == ''
        run: npx electron-builder --mac --x64 --arm64 --publish never -c.mac.notarize=false -c.mac.identity=null
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v5
        with:
          name: mac
          path: dist/*.dmg

      - name: Delete keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true

  windows:
    # Each arch is built on a runner of that arch, the same way the linux job below does it.
    # Cross building arm64 on the x64 runner produced an installer whose binaries did not match
    # the machine and were removed during installation.
    strategy:
      fail-fast: false          # an arm64 failure must not sink the x64 release
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Set version
        shell: bash
        run: bash .github/set-version.sh "${{ inputs.version || github.ref_name }}"
      - run: npm install --no-audit --no-fund

      # Every .exe and .dll we ship is signed with Azure Trusted Signing. Unsigned Electron
      # binaries get quarantined by Defender, which is how 0.2.1 installed a folder full of .pak
      # files with no ObjectExplorer.exe in it. SIGN_WINDOWS is read by electron-builder.cjs, which
      # explains there why signing has to be per-build rather than a package.json setting; the
      # AZURE_* secrets are what Azure's EnvironmentCredential reads to authenticate.
      # nsis and msiWrapped stay separate invocations so a target that fails or silently skips
      # is visible as its own step in the log.
      - name: Build signed installers
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never --config electron-builder.cjs
        env:
          SIGN_WINDOWS: "true"
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # x64 only, and not by choice: MsiTarget rewrites arm64 to x64 before building the wxs
      # (a wix 4 limitation, electron-builder issue 6077), and MsiWrappedTarget uses that same
      # rewritten arch to pick the NSIS exe it wraps. An arm64 MSI therefore wraps the *x64*
      # installer — the wrong-arch artifact this job exists to prevent. ARM users take the .exe
      # or the .msix; see RELEASE.md.
      - name: Build signed MSI
        if: matrix.arch == 'x64'
        run: npx electron-builder --win msiWrapped --${{ matrix.arch }} --publish never --config electron-builder.cjs
        env:
          SIGN_WINDOWS: "true"
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Partner Center re-signs the msix itself, so this one stays unsigned and keeps the
      # build.appx.publisher identity.
      - name: Build unsigned Store packages
        run: npx electron-builder --win appx --${{ matrix.arch }} --publish never --config electron-builder.cjs

      - uses: actions/upload-artifact@v5
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.msix

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Set version
        run: bash .github/set-version.sh "${{ inputs.version || github.ref_name }}"
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --linux --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.AppImage

  release:
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ObjectExplorer ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
