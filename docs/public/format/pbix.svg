<!-- Power BI report (.pbix, .pbit): a report page is charts over a model, so the icon is a column
     chart standing on its axis on an amber tile - four columns and the base line under them.
     Drawn here for this repo; it is not the Microsoft Power BI mark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<rect x="3" y="3" width="18" height="18" rx="2" fill="#c9900c"/>
	<g fill="#fff">
		<rect x="6" y="12" width="2.4" height="5.2"/>
		<rect x="9.6" y="8.5" width="2.4" height="8.7"/>
		<rect x="13.2" y="10.5" width="2.4" height="6.7"/>
		<rect x="16.8" y="6" width="2.4" height="11.2"/>
	</g>
	<path d="M5.2 18.4h13.6" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
</svg>
