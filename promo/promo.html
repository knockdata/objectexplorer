// The product film, as one function of time. Nothing animates on its own: scripts/promo.mjs sets the
// clock frame by frame and screenshots each one, so a slow machine cannot drop a frame and the film is
// the same every time it is built. Open it with ?t=12.5 to look at one moment.
//
// Two kinds of cut, one word or line a card and the explorer's own screen, in the Typeframes style. The
// screens are stills the explorer took of itself offscreen, step by step (foldone's
// build/scratch/film/shots.sh, exported by export.py into ./shots with targets.js); the page draws the
// cursor moving and clicking between them, the typing as a reveal of the next still, and the camera
// zooming and panning onto what matters.
//
// Every cut is counted in beats of the music (promo.mjs passes ?tempo= and ?first= from the track's
// .beats.json, written by scripts/promo-beats.py), so another track is one render away.
import { targets } from "./shots/targets.js"

// track's own ending lands on its first beat and rings out under it, and the film ends as that does

function centre(box) {
	return [box.x + box.width / 2, box.y + box.height / 2]
}

// where the cursor points on a tree row: a little into its name, not the middle of the row
function onLabel(name) {
	const box = targets.tree[name]
	return [box.x + Math.min(48, box.width / 3), box.y + box.height / 2]
}

// One cut of the montage: the cursor goes to the file in the tree while the camera pulls back, clicks,
// the file opens and the camera moves onto what it drew. `previous` is the file before it, where the
// cursor and the camera start.
function openFile(file, label, beats, previous) {
	const name = file.replace(/\.[^.]*$/, "")
	const moments = [
		{ at: 0, show: previous === undefined ? "documents" : `open_${previous.replace(/\.[^.]*$/, "")}` },
		{ at: 0, view: previous === undefined ? FULL : targets.content[previous.replace(/\.[^.]*$/, "")], beats: 0 },
		{ at: 0, view: FULL, beats: 0.9 },
		{ at: 0, cursor: previous === undefined ? [700, 420] : onLabel(previous), beats: 0 },
		{ at: 0.1, cursor: onLabel(file), beats: 0.9 },
		{ at: 1.1, click: true },
		{ at: 1.25, show: `open_${name}` },
		{ at: 1.4, view: targets.content[name], beats: 1.1 },
		{ at: 1.3, caption: label, until: beats },
	]
	return { beats, screen: moments }
}

// when each cut starts: the first runs from 0 to its last beat, every other one on the beat grid, the
// end card after the last beat
let counted = 0
const starts = scenes.map(function start(scene, index) {
	const at = index === 0 ? 0 : FIRST + counted * BEAT
	counted += scene.beats ?? 0
	return at
})
const MUSIC_END = FIRST + counted * BEAT
const DURATION = MUSIC_END + END_SECONDS

// what reads badly: a caption on screen less than 1.5 s, a card shorter than that
const warnings = []
scenes.forEach(function check(scene, index) {
	const seconds = (scene.beats ?? 0) * BEAT
	if (scene.card !== undefined && scene.seconds === undefined && seconds < 1.5) {
		warnings.push(`cut ${index}: a card of ${seconds.toFixed(2)} s`)
	}
	for (const moment of scene.screen ?? []) {
		if (moment.caption !== undefined && (moment.until - moment.at) * BEAT < 1.5) {
			warnings.push(`cut ${index}: "${moment.caption}" for ${((moment.until - moment.at) * BEAT).toFixed(2)} s`)
		}
	}
})

function clamp(value) {
	return Math.max(0, Math.min(1, value))
}

function easeOut(fraction) {
	return 1 - Math.pow(1 - fraction, 3)
}

function easeInOut(fraction) {
	return fraction < 0.5 ? 4 * fraction * fraction * fraction : 1 - Math.pow(-2 * fraction + 2, 3) / 2
}

// the loop drawn round the name, as by a brush
const LOOP = "M 40 118 C 20 40, 260 8, 520 14 C 760 20, 860 70, 840 120 C 820 178, 560 196, 330 190 C 120 184, 6 160, 30 104 C 46 66, 140 44, 220 40"

function titleMarkup(scene) {
	const url = scene.url ? `<div class="card-url">objectexplorer.com</div>` : ""
	return `<div class="card-title">
		<svg class="card-loop" viewBox="0 0 880 210" width="880" height="210"><path d="${LOOP}" pathLength="1"/></svg>
		<img class="card-mark" src="../assets/mark.png">
		<span class="card-name">Object<em>Explorer</em></span>
	</div>
	<div class="card-tagline">Open any file. Right where it is.</div>
	${url}`
}

function cardMarkup(scene) {
	let markup = ""
	if (scene.title) {
		markup = titleMarkup(scene)
	}
	else {
		const words = scene.row
			? `<div class="card-line card-row">${scene.lines.map((line) => `<span class="word">${line}</span>`).join("")}</div>`
			: scene.lines.map((line) => `<div class="card-line">${line.split(" ").map((word) => `<span class="word">${word}</span>`).join(" ")}</div>`).join("")
		const small = scene.small ? `<div class="card-small word">${scene.small}</div>` : ""
		const chips = scene.chips ? `<div class="card-chips">${scene.chips.map((chip) => `<span class="chip word">${chip}</span>`).join("")}</div>` : ""
		markup = `<div class="card-words ${scene.size ?? ""}">${words}${small}${chips}</div>`
	}
	return markup
}

function drawCard(scene, index, local) {
	if (card.dataset.index !== String(index)) {
		card.dataset.index = String(index)
		card.className = `card card-${scene.card}`
		card.innerHTML = cardMarkup(scene)
	}
	card.style.opacity = "1"
	// the words come up one after another; with `pop` one every that many beats, the chips one a beat
	const words = [...card.querySelectorAll(".word")]
	const chipStart = words.filter((word) => word.classList.contains("chip") === false).length
	words.forEach(function show(word, order) {
		let delay = order * 0.07
		if (word.classList.contains("chip")) {
			delay = 0.6 + (order - chipStart) * (scene.pop ?? 1) * BEAT
		}
		else if (scene.pop !== undefined) {
			delay = order * scene.pop * BEAT
		}
		const shown = easeOut(clamp((local - delay) / 0.28))
		word.style.opacity = String(shown)
		word.style.transform = `translateY(${(1 - shown) * 46}px)`
	})
	const drift = 1 + local * 0.012
	const holder = card.querySelector(".card-words")
	if (holder !== null) {
		holder.style.transform = `scale(${drift})`
	}
	const loop = card.querySelector(".card-loop path")
	if (loop !== null) {
		loop.style.strokeDashoffset = String(scene.url ? 1 - easeInOut(clamp(local / 0.7)) : 1 - easeInOut(clamp((local - 0.3) / 1.1)))
		const title = card.querySelector(".card-title")
		const shown = easeOut(clamp(local / (scene.url ? 0.2 : 0.5)))
		title.style.opacity = String(shown)
		title.style.transform = `scale(${0.94 + 0.06 * shown + local * 0.006})`
		// the end card shows its address at once, so it is on screen long enough to read
		const quick = scene.url === true
		const tagline = card.querySelector(".card-tagline")
		tagline.style.opacity = String(easeOut(clamp((local - (quick ? 0.1 : 0.9)) / (quick ? 0.25 : 0.5))))
		const url = card.querySelector(".card-url")
		if (url !== null) {
			url.style.opacity = String(easeOut(clamp((local - 0.2) / 0.25)))
			// a small bump as the music's ending lands, one beat in
			const since = local - BEAT
			const bump = since >= 0 && since < 0.35 ? Math.sin(since / 0.35 * Math.PI) * 0.06 : 0
			url.style.transform = `scale(${1 + bump})`
		}
	}
}

// ---- the screen ----

// the camera on a box of the window: scaled to fit it, its middle in the frame's middle. The window always
// fills the whole frame: never smaller than it, and moved in from an edge rather than show past it
function camera(view) {
	const scale = Math.min(2.3, Math.min(STAGE.width / view.width, STAGE.height / view.height))
	return held({ x: view.x + view.width / 2, y: view.y + view.height / 2, scale })
}

function held(shot) {
	const scale = Math.max(1, shot.scale)
	const halfWidth = STAGE.width / 2 / scale
	const halfHeight = STAGE.height / 2 / scale
	return {
		x: Math.min(STAGE.width - halfWidth, Math.max(halfWidth, shot.x)),
		y: Math.min(STAGE.height - halfHeight, Math.max(halfHeight, shot.y)),
		scale,
	}
}

// the moments of one kind, in order, with the one in force at `beat` and the one before it
function latest(moments, key, beat) {
	const list = moments.filter((moment) => moment[key] !== undefined)
	let index = -1
	list.forEach(function find(moment, order) {
		if (moment.at <= beat) {
			index = order
		}
	})
	return { list, index }
}

function viewAt(moments, beat) {
	const { list, index } = latest(moments, "view", beat)
	let shot = camera(FULL)
	if (index >= 0) {
		const moment = list[index]
		const target = camera(moment.view)
		const from = index > 0 ? camera(list[index - 1].view) : target
		const progress = moment.beats > 0 ? easeInOut(clamp((beat - moment.at) / moment.beats)) : 1
		shot = held({
			x: from.x + (target.x - from.x) * progress,
			y: from.y + (target.y - from.y) * progress,
			// a zoom feels even when the scale moves by the same factor each frame, not the same amount
			scale: from.scale * Math.pow(target.scale / from.scale, progress),
		})
	}
	return shot
}

function cursorAt(moments, beat) {
	const { list, index } = latest(moments, "cursor", beat)
	let point = undefined
	if (index >= 0) {
		const moment = list[index]
		const from = index > 0 ? list[index - 1].cursor : moment.cursor
		const progress = moment.beats > 0 ? easeInOut(clamp((beat - moment.at) / moment.beats)) : 1
		point = [from[0] + (moment.cursor[0] - from[0]) * progress, from[1] + (moment.cursor[1] - from[1]) * progress]
	}
	return point
}

// the stills drawn at `beat`, bottom first: the one shown, over what it fades in on or is revealed over
function layersAt(shows, index, beat) {
	const moment = shows[index]
	let layers = []
	if (moment.wipe !== undefined) {
		const progress = clamp((beat - moment.at) / moment.beats)
		const below = index > 0 ? layersAt(shows, index - 1, Infinity) : []
		layers = below.concat([{ still: moment.show, alpha: 1, wipe: moment, progress }])
	}
	else {
		const seconds = moment.fade ?? FADE
		const fade = moment.at === 0 || seconds === 0 ? 1 : clamp((beat - moment.at) * BEAT / seconds)
		const below = fade < 1 && index > 0 ? layersAt(shows, index - 1, Infinity) : []
		layers = below.concat([{ still: moment.show, alpha: fade }])
	}
	return layers
}

// the box of a still revealed so far: typing goes across a character at a time, an answer comes in down
function revealed(wipe, progress) {
	const box = wipe.wipe
	let shown = { x: box.x, y: box.y, width: box.width, height: box.height }
	if (wipe.down) {
		shown.height = box.height * easeOut(progress)
	}
	else {
		const characters = wipe.characters ?? 20
		shown.width = box.width * Math.floor(progress * characters) / characters
	}
	return shown
}

function roundedRectangle(x, y, width, height, radius) {
	context.beginPath()
	context.moveTo(x + radius, y)
	context.arcTo(x + width, y, x + width, y + height, radius)
	context.arcTo(x + width, y + height, x, y + height, radius)
	context.arcTo(x, y + height, x, y, radius)
	context.arcTo(x, y, x + width, y, radius)
	context.closePath()
}

function background() {
	const gradient = context.createLinearGradient(0, 0, 0, STAGE.height)
	gradient.addColorStop(0, "#f3f6f3")
	gradient.addColorStop(1, "#dfe8e1")
	context.fillStyle = gradient
	context.fillRect(0, 0, STAGE.width, STAGE.height)
	const glow = context.createRadialGradient(STAGE.width * 0.8, STAGE.height * 0.1, 0, STAGE.width * 0.8, STAGE.height * 0.1, 700)
	glow.addColorStop(0, "rgba(61, 204, 112, 0.22)")
	glow.addColorStop(1, "rgba(61, 204, 112, 0)")
	context.fillStyle = glow
	context.fillRect(0, 0, STAGE.width, STAGE.height)
}

// the macOS pointer: black with a white rim, its tip at the point
function drawPointer(x, y, pressed) {
	const size = pressed ? 1.25 : 1.4
	context.save()
	context.translate(x, y)
	context.scale(size, size)
	context.beginPath()
	context.moveTo(0, 0)
	context.lineTo(0, 17)
	context.lineTo(4.2, 13.2)
	context.lineTo(7, 19.6)
	context.lineTo(10, 18.4)
	context.lineTo(7.3, 12.2)
	context.lineTo(12.6, 12.2)
	context.closePath()
	context.shadowColor = "rgba(0, 0, 0, 0.35)"
	context.shadowBlur = 4
	context.shadowOffsetY = 1.5
	context.lineJoin = "round"
	context.lineWidth = 1.6
	context.strokeStyle = "#ffffff"
	context.stroke()
	context.shadowColor = "transparent"
	context.fillStyle = "#111111"
	context.fill()
	context.restore()
}

function drawScreen(scene, local) {
	const beat = local / BEAT
	const moments = scene.screen
	const shot = viewAt(moments, beat)
	context.fillStyle = "#1e1e1e"
	context.fillRect(0, 0, STAGE.width, STAGE.height)
	context.save()
	context.translate(STAGE.width / 2, STAGE.height / 2)
	context.scale(shot.scale, shot.scale)
	context.translate(-shot.x, -shot.y)
	context.save()
	const { list, index } = latest(moments, "show", beat)
	const layers = index >= 0 ? layersAt(list, index, beat) : []
	for (const layer of layers) {
		// the input emptied first, so what it showed before (a placeholder) does not peek out past the typing
		if (layer.wipe !== undefined && layer.wipe.wipe.blank !== undefined) {
			const box = layer.wipe.wipe
			context.fillStyle = box.blank
			context.fillRect(box.x, box.y, box.width, box.height)
		}
		context.save()
		context.globalAlpha = layer.alpha
		if (layer.wipe !== undefined) {
			const box = revealed(layer.wipe, layer.progress)
			context.beginPath()
			context.rect(box.x, box.y, box.width, box.height)
			context.clip()
		}
		context.drawImage(pictures[layer.still], 0, 0, STAGE.width, STAGE.height)
		context.restore()
		// the caret at the end of what is typed so far
		if (layer.wipe !== undefined && layer.wipe.down !== true && layer.progress < 1) {
			const box = revealed(layer.wipe, layer.progress)
			context.fillStyle = "#e8e8e8"
			context.fillRect(box.x + box.width, box.y + 3, 1.2, box.height - 6)
		}
	}
	context.restore()
	context.restore()
	// the pointer and its clicks, the same size whatever the zoom
	const point = cursorAt(moments, beat)
	if (point !== undefined) {
		const x = STAGE.width / 2 + (point[0] - shot.x) * shot.scale
		const y = STAGE.height / 2 + (point[1] - shot.y) * shot.scale
		let pressed = false
		for (const moment of moments.filter((item) => item.click)) {
			const since = (beat - moment.at) * BEAT
			if (since >= 0 && since < 0.45) {
				const grow = easeOut(since / 0.45)
				context.beginPath()
				context.arc(x, y, 6 + grow * 24, 0, Math.PI * 2)
				context.strokeStyle = `rgba(61, 204, 112, ${0.9 * (1 - grow)})`
				context.lineWidth = 4
				context.stroke()
				pressed = pressed || since < 0.12
			}
		}
		drawPointer(x, y, pressed)
	}
}

// the library on every kind of screen: the desktop's window, an iPad and an iPhone, each sliding up in turn
function drawDevices(local) {
	background()
	const devices = [
		{ still: "library", x: 40, y: 170, width: 640, height: 360, radius: 12, bezel: 0, delay: 0 },
		{ still: "library_tablet", x: 726, y: 150, width: 294, height: 392, radius: 20, bezel: 12, delay: 1 },
		{ still: "library_phone", x: 1066, y: 162, width: 172, height: 373, radius: 26, bezel: 9, delay: 2 },
	]
	for (const device of devices) {
		const shown = easeOut(clamp((local - device.delay * BEAT) / 0.5))
		const lift = (1 - shown) * 120 - local * 4
		context.save()
		context.globalAlpha = shown
		context.translate(0, lift)
		context.shadowColor = "rgba(10, 30, 18, 0.35)"
		context.shadowBlur = 50
		context.shadowOffsetY = 20
		roundedRectangle(device.x - device.bezel, device.y - device.bezel, device.width + device.bezel * 2, device.height + device.bezel * 2, device.radius + device.bezel)
		context.fillStyle = "#0d0f0e"
		context.fill()
		context.shadowColor = "transparent"
		roundedRectangle(device.x, device.y, device.width, device.height, device.radius)
		context.clip()
		context.drawImage(pictures[device.still], device.x, device.y, device.width, device.height)
		context.restore()
	}
}

function drawCaption(text, shown, key) {
	if (caption.dataset.key !== key) {
		caption.dataset.key = key
		caption.innerHTML = text === "" ? "" : `<span>${text}</span>`
	}
	caption.style.opacity = String(shown)
	caption.style.transform = `translate(-50%, ${(1 - shown) * 30}px)`
}

function drawKeys(list, shown, key) {
	if (keys.dataset.key !== key) {
		keys.dataset.key = key
		keys.innerHTML = list.map((name) => `<span class="key">${name}</span>`).join("")
	}
	keys.style.opacity = String(shown)
	keys.style.transform = `translate(-50%, ${(1 - shown) * -20}px) scale(${0.9 + 0.1 * shown})`
}

// the caption or keys of a cut at `beat`: shown from `at` to `until`, coming up and going quickly
function overlay(moments, key, beat) {
	let found = { value: undefined, shown: 0, key: "" }
	moments.forEach(function find(moment, order) {
		if (moment[key] !== undefined && beat >= moment.at && beat < moment.until) {
			const coming = clamp((beat - moment.at) * BEAT / 0.25)
			const going = clamp((moment.until - beat) * BEAT / 0.2)
			found = { value: moment[key], shown: easeOut(Math.min(coming, going)), key: `${order}` }
		}
	})
	return found
}

function renderFrame(time) {
	const at = Math.max(0, Math.min(time, DURATION - 0.001))
	const ratio = window.devicePixelRatio || 1
	if (canvas.width !== Math.round(STAGE.width * ratio)) {
		canvas.width = Math.round(STAGE.width * ratio)
		canvas.height = Math.round(STAGE.height * ratio)
	}
	context.setTransform(ratio, 0, 0, ratio, 0, 0)
	context.imageSmoothingEnabled = true
	context.imageSmoothingQuality = "high"
	let index = 0
	starts.forEach(function find(start, order) {
		if (start <= at) {
			index = order
		}
	})
	const scene = scenes[index]
	const local = at - starts[index]
	const beat = local / BEAT
	let moments = []
	if (scene.card !== undefined) {
		drawCard(scene, index, local)
		canvas.style.opacity = "0"
	}
	else {
		card.style.opacity = "0"
		canvas.style.opacity = "1"
		if (scene.devices) {
			drawDevices(local)
			moments = [{ at: 0.6, caption: scene.caption, until: scene.beats }]
		}
		else {
			drawScreen(scene, local)
			moments = scene.screen
		}
	}
	const words = overlay(moments, "caption", beat)
	drawCaption(words.value ?? "", words.shown, `${index}:${words.key}`)
	const pressed = overlay(moments, "keys", beat)
	drawKeys(pressed.value ?? [], pressed.shown, `${index}:${pressed.key}`)
}

window.promoDuration = DURATION
window.promoScenes = starts
window.promoMusicEnd = MUSIC_END
window.promoWarnings = warnings
window.renderFrame = renderFrame
// every picture decoded and the fonts loaded before the first frame is asked for, or a cut lands on
// an empty box
const mark = new Image()
mark.src = "../assets/mark.png"
window.promoReady = Promise.all([...Object.values(pictures), mark].map((picture) => picture.decode().catch(() => undefined)))
	.then(() => document.fonts.ready)
	.then(() => renderFrame(Number(params.get("t") ?? 0)))
</script>
</body>
</html>
