<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 594" width="800" height="594" role="img"
	aria-label="How ObjectExplorer works: one native program holds the window, the readers, the query engine, the cache and the agent door. The window calls them in the same process, with no local server in between; an agent reaches the same program over MCP. The program signs requests straight to your storage, keeps what it remembers in ~/.objectexplorer and the keychain, and calls objectexplorer.com only for updates, the licence and large share links.">
<style>
	.bg { fill: #10141a }
	.zone { fill: none; stroke: #2b3644; stroke-width: 1; stroke-dasharray: 4 4 }
	.box { fill: #171d26; stroke: #2b3644; stroke-width: 1 }
	.hot { fill: #171d26; stroke: #3dcc70; stroke-width: 1.2 }
	.disk { fill: #131a14; stroke: #2e5a3c; stroke-width: 1 }
	.far { fill: #10141a; stroke: #4a5666; stroke-width: 1; stroke-dasharray: 3 3 }
	.head { fill: #7d8998; font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.1em; text-transform: uppercase }
	.title { fill: #e3eaf3; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif }
	.ink { fill: #c9d3e0; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif }
	.mid { fill: #7d8998; font: 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif }
	.mono { fill: #9fb6d0; font: 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
	.green { fill: #3dcc70; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif }
	.arrow { stroke: #4a5666; stroke-width: 1.2; fill: none }
	.arrow-hot { stroke: #3dcc70; stroke-width: 1.4; fill: none }
	.arrow-far { stroke: #4a5666; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3 }
</style>
<defs>
	<marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
		<path d="M0,0 L10,5 L0,10" fill="none" stroke="#4a5666" stroke-width="1.6"/>
	</marker>
	<marker id="tip-hot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
		<path d="M0,0 L10,5 L0,10" fill="none" stroke="#3dcc70" stroke-width="1.6"/>
	</marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="594" rx="8"/>

<!-- your machine -->
<rect class="zone" x="16" y="30" width="532" height="548" rx="10"/>
<text class="head" x="32" y="52">Your machine</text>

<!-- an agent, outside the program -->
<rect class="box" x="32" y="72" width="160" height="86" rx="6"/>
<text class="title" x="46" y="96">An agent</text>
<text class="mid" x="46" y="114">Claude Code, Codex</text>
<text class="ink" x="46" y="136">holds no cloud credential</text>

<!-- a browser, outside the program -->
<rect class="box" x="32" y="174" width="160" height="86" rx="6"/>
<text class="title" x="46" y="198">Your browser</text>
<text class="mid" x="46" y="216">when started in a terminal</text>
<text class="mono" x="46" y="238">127.0.0.1:9421</text>

<!-- the one program -->
<rect class="hot" x="208" y="72" width="324" height="292" rx="6"/>
<text class="title" x="222" y="96">One program</text>
<text class="mid" x="312" y="96">one native binary</text>

<rect class="box" x="222" y="108" width="296" height="44" rx="5"/>
<text class="ink" x="234" y="126">The window</text>
<text class="mid" x="234" y="143">drawn on the GPU: Metal, Direct3D, Vulkan</text>

<rect class="box" x="222" y="158" width="296" height="44" rx="5"/>
<text class="ink" x="234" y="176">Readers</text>
<text class="mid" x="234" y="193">one per format, each in a copy of the process</text>

<rect class="box" x="222" y="208" width="296" height="44" rx="5"/>
<text class="ink" x="234" y="226">SQL engine · models · Python sessions</text>
<text class="mid" x="234" y="243">queries run here, next to the file</text>

<rect class="box" x="222" y="258" width="296" height="44" rx="5"/>
<text class="ink" x="234" y="276">Agent door: rule gate + PII rules</text>
<text class="mid" x="234" y="293">MCP on 127.0.0.1:3417, every call logged</text>

<rect class="box" x="222" y="308" width="296" height="44" rx="5"/>
<text class="ink" x="234" y="326">Providers + cache</text>
<text class="mid" x="234" y="343">each request signed with your own credentials</text>

<!-- the window calls in the same process -->

<text class="green" x="222" y="384">the window calls the rest in the same process:</text>
<text class="green" x="222" y="400">no local server in between</text>

<!-- agent and browser into the program -->
<path class="arrow-hot" d="M192,115 C206,115 204,280 222,280" marker-end="url(#tip-hot)"/>
<path class="arrow-hot" d="M192,217 C204,217 206,130 220,130" marker-end="url(#tip-hot)"/>

<!-- what is kept -->
<rect class="disk" x="32" y="420" width="500" height="142" rx="6"/>
<text class="title" x="46" y="444">~/.objectexplorer</text>
<text class="mid" x="186" y="444">what is kept, and only here</text>
<text class="mono" x="46" y="468">explorer.db</text>
<text class="ink" x="166" y="468">listings, notebook code, how each opening went</text>
<text class="mono" x="46" y="488">cache/ index/</text>
<text class="ink" x="166" y="488">parts of cloud objects you opened; words found</text>
<text class="mono" x="46" y="508">mcp/ mcp.yaml</text>
<text class="ink" x="166" y="508">every agent call, never the rows; your rules</text>
<text class="mono" x="46" y="528">replay/ venvs/</text>
<text class="ink" x="166" y="528">recorded sessions; Python environments</text>
<text class="mid" x="46" y="550">credentials: the system keychain · not kept: query results, the rows an agent was sent</text>
<path class="arrow" d="M505,364 L505,420" marker-start="url(#tip)" marker-end="url(#tip)"/>

<!-- your storage -->
<text class="head" x="582" y="52">Your storage</text>
<rect class="box" x="582" y="72" width="198" height="36" rx="5"/>
<text class="ink" x="596" y="95">Amazon S3 · S3 compatible</text>
<rect class="box" x="582" y="116" width="198" height="36" rx="5"/>
<text class="ink" x="596" y="139">Google Cloud Storage</text>
<rect class="box" x="582" y="160" width="198" height="36" rx="5"/>
<text class="ink" x="596" y="183">Azure Blob · OneLake</text>
<rect class="box" x="582" y="204" width="198" height="36" rx="5"/>
<text class="ink" x="596" y="227">Drive, OneDrive, Dropbox, Box</text>
<rect class="box" x="582" y="248" width="198" height="36" rx="5"/>
<text class="ink" x="596" y="271">folders on your disks</text>
<path class="arrow-hot" d="M518,330 L562,330"/>
<path class="arrow-hot" d="M562,90 L562,330"/>
<path class="arrow-hot" d="M562,90 L580,90" marker-end="url(#tip-hot)"/>
<path class="arrow-hot" d="M562,134 L580,134" marker-end="url(#tip-hot)"/>
<path class="arrow-hot" d="M562,178 L580,178" marker-end="url(#tip-hot)"/>
<path class="arrow-hot" d="M562,222 L580,222" marker-end="url(#tip-hot)"/>
<path class="arrow-hot" d="M562,266 L580,266" marker-end="url(#tip-hot)"/>
<text class="mid" x="582" y="310">straight from your machine:</text>
<text class="mid" x="582" y="326">no proxy, no relay, no copy</text>
<text class="mid" x="582" y="342">anywhere but here</text>

<!-- the one outside call -->
<rect class="far" x="582" y="420" width="198" height="104" rx="6"/>
<text class="title" x="596" y="444">objectexplorer.com</text>
<text class="ink" x="596" y="466">version check · licence</text>
<text class="ink" x="596" y="484">large share links, until they expire</text>
<text class="green" x="596" y="510">never an object you browse</text>
<path class="arrow-far" d="M532,472 L582,472" marker-end="url(#tip)"/>
</svg>
