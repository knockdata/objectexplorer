name: release

run-name: ObjectExplorer v${{ inputs.version }} to npm, brew and winget

# A created release taken to everyone: npm, the Homebrew tap and winget, from the GitHub release
# v<version> alone. create-release.yml made that release from the signed files and attached publish.tar
# (version, npm/*.tgz with the signed binaries, brew/objectexplorer.rb and brew/objectexplorer-app.rb
# with the signed files' sha256), so this run needs no artifact of that one, which expire after
# 5 days: a version can be published any time after it was created. foldone's
# tools/publish-release.sh <version> dispatches it, watches it and checks npm and the tap.
#
#   source       the release v<version> published (not a draft), publish.tar downloaded, its
#                version checked; an rc (1.2.3-rc.1) is a prerelease
#   npm          the six platform packages, then @knockdata/objectexplorer (OIDC trusted
#                publishing; an rc under the dist-tag rc)
#   npm-verify   the registry asked until it says so
#   brew         knockdata/homebrew-tap's formula and cask (TAP_TOKEN); not for an rc
#   winget       the new version of KnockData.ObjectExplorer (both msix of the release) proposed
#                to microsoft/winget-pkgs as a pull request from rockie-yang's fork (komac,
#                WINGET_TOKEN); not for an rc, skipped while the secret is missing
#
# Each step leaves a version already published alone, so a run can be dispatched again.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The GitHub release's version (v<version>, made by create-release.yml)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pick.outputs.version }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
    steps:
      # through env, not ${{ }} inside the script: an expression is pasted in as text before
      # bash sees it, so a value typed with a quote in it would run as a command
      - id: pick
        env:
          CLAIMED: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$CLAIMED"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "publishing $version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::expected a version like 1.2.3 or 1.2.3-rc.1, got '$version'"
            exit 1
          fi
          draft=$(gh release view "v$version" --json isDraft --jq '.isDraft')
          if [ "$draft" = "false" ]; then
            gh release download "v$version" --pattern publish.tar
          else
            echo "::error::v$version is a draft: create-release.yml did not finish"
            exit 1
          fi
          mkdir publish
          tar -xf publish.tar -C publish
          inside=$(cat publish/version)
          if [ "$inside" = "$version" ]; then
            ls -la publish/npm publish/brew
          else
            echo "::error::publish.tar is $inside, not $version"
            exit 1
          fi
          numbers="${version%%-*}"
          prerelease=false
          if [ "$numbers" != "$version" ]; then
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: npm
          path: publish/npm
          retention-days: 5
      - uses: actions/upload-artifact@v6
        with:
          name: brew
          path: publish/brew
          retention-days: 5

  npm:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # npm trusted publishing: the registry trusts this repository and this workflow file by name
    # (release.yml: the file name stays), and GitHub mints the OIDC token for the exchange only with id-token: write. No
    # NPM_TOKEN on purpose: a token in the environment is used before OIDC, and a 2FA account
    # answers EOTP.
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.source.outputs.version }}
      PRERELEASE: ${{ needs.source.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm
          path: npm
      # no registry-url: it writes an .npmrc with _authToken=${NODE_AUTH_TOKEN}, and with no such
      # variable npm sends an empty credential instead of reaching for OIDC
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest
      # the platform packages first, so the main one's optionalDependencies resolve (a path, ./npm/…: npm 11 reads npm/x.tgz as github:npm/x.tgz); a version
      # already on npm is left alone (npm never takes one twice, and a re-run would fail)
      - name: Publish
        run: |
          set -euo pipefail
          tag=()
          if [ "$PRERELEASE" = "true" ]; then
            tag=(--tag rc)
          fi
          files=()
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            files+=("./npm/knockdata-objectexplorer-$target-$VERSION.tgz")
          done
          files+=("./npm/knockdata-objectexplorer-$VERSION.tgz")
          for file in "${files[@]}"; do
            name=$(tar -xOzf "$file" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            if [ "$(npm view "$name@$VERSION" version 2> /dev/null || true)" = "$VERSION" ]; then
              echo "$name@$VERSION is already on npm"
            else
              npm publish "$file" --access public "${tag[@]}"
            fi
          done

  # its own job: when the registry is slow, re-running the failed jobs re-runs this check alone
  npm-verify:
    needs: [source, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # past releases showed up between 75 s and 117 s after the publish: the first check waits
      # 90 s, then every 15 s until 10 minutes have passed
      - name: Verify
        run: |
          sleep 90
          for attempt in $(seq 1 34); do
            published=$(npm view "@knockdata/objectexplorer@$VERSION" version 2> /dev/null || echo "")
            if [ "$published" = "$VERSION" ]; then
              echo "npm has $VERSION after $attempt checks" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: the registry says ${published:-nothing}, waiting 15 s"
            sleep 15
          done
          echo "::error::npm does not have $VERSION"
          exit 1

  # knockdata/homebrew-tap: Formula/objectexplorer.rb, Casks/objectexplorer-app.rb. Not for an
  # rc: the tap has one version, and brew install would give everyone the rc
  brew:
    needs: [source, npm-verify]
    if: needs.source.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.source.outputs.version }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: brew
          path: brew
      - name: Commit to the tap
        run: |
          set -euo pipefail
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/knockdata/homebrew-tap.git" tap
          mkdir -p tap/Formula tap/Casks
          cp brew/objectexplorer.rb tap/Formula/objectexplorer.rb
          cp brew/objectexplorer-app.rb tap/Casks/objectexplorer-app.rb
          cd tap
          git config user.name "objectexplorer release"
          git config user.email "rockie@knockdata.com"
          git add Formula/objectexplorer.rb Casks/objectexplorer-app.rb
          if git diff --cached --quiet; then
            echo "the tap already has $VERSION"
          else
            git commit -q -m "objectexplorer $VERSION"
            git push -q origin HEAD
            echo "the tap has $VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi

  # winget: komac reads both msix of the release (their sha256, signature hash and package family
  # name), writes the new version's manifests from the last one in microsoft/winget-pkgs, and opens
  # the pull request there from the token owner's fork; Microsoft's validation then merges it.
  # The package's first version was submitted by hand (foldone docs/release.md §6.6).
  winget:
    needs: source
    # off for now (owner, 2026-10-15); back on: if: needs.source.outputs.prerelease != 'true'
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.source.outputs.version }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Propose the version to winget
        run: |
          set -euo pipefail
          if [ -z "$WINGET_TOKEN" ]; then
            echo "no WINGET_TOKEN: winget left out" >> "$GITHUB_STEP_SUMMARY"
          else
            curl -fsSL -o komac.tar.gz https://github.com/russellbanks/Komac/releases/download/v2.16.0/komac-2.16.0-x86_64-unknown-linux-gnu.tar.gz
            tar -xzf komac.tar.gz
            komac=$(find . -name komac -type f -perm -u+x | head -1)
            base="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
            GITHUB_TOKEN="$WINGET_TOKEN" "$komac" update KnockData.ObjectExplorer \
              --version "$VERSION" \
              --urls "$base/objectexplorer-windows-x64.msix" "$base/objectexplorer-windows-arm64.msix" \
              --submit
            echo "winget: KnockData.ObjectExplorer $VERSION proposed" >> "$GITHUB_STEP_SUMMARY"
          fi
