<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img"
	aria-label="One pole on the usage disc, labelled: the base and its two-arc gauge at the bottom, the pole itself, balls on sticks inside and outside the one-year ring, a halo round a ball that has been opened, and the cap with its pale centre on top.">
<style>
	.bg { fill: #10141a }
	.ink { fill: #c9d3e0; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif }
	.dim { fill: #7d8998; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif }
	.lead { stroke: #4a5666; stroke-width: 1; fill: none }
	.floor { stroke: #2b3644; stroke-width: 1.5; fill: none }
	.hue { fill: #4a7ba6 }
	.hue-line { stroke: #4a7ba6; stroke-width: 2; fill: none }
	.pole { fill: #4d545f }
	.core { fill: #b7d2e8 }
	.gauge-dark { stroke: #3a4552; stroke-width: 4; fill: none }
	.gauge-human { stroke: #e3eaf3; stroke-width: 4; fill: none; stroke-linecap: round }
	.gauge-agent { stroke: #e8b04b; stroke-width: 4; fill: none; stroke-linecap: round }
	.stick { stroke: #5f6874; stroke-width: 2; fill: none }
	.halo { stroke: #e3eaf3; stroke-width: 1.6; fill: none; opacity: 0.85 }
</style>
<rect class="bg" x="0" y="0" width="760" height="440" rx="8"/>

<!-- the floor the pole stands on -->
<ellipse class="floor" cx="250" cy="382" rx="215" ry="36" stroke-dasharray="4 6"/>

<!-- the pole, narrowing toward the top -->
<polygon class="pole" points="243,374 257,374 253.5,124 246.5,124"/>

<!-- base puck and the gauge ring around it -->
<ellipse class="hue" cx="250" cy="372" rx="30" ry="9"/>
<ellipse class="gauge-dark" cx="250" cy="372" rx="46" ry="12"/>
<polyline class="gauge-human" points="210.2,378.0 227.0,382.4 250,384.0 273.0,382.4 289.8,378.0"/>
<polyline class="gauge-agent" points="289.8,378.0 295.3,374.1 295.3,369.9 289.8,366.0"/>

<!-- the one-year ring, and the balls placed against it -->
<ellipse class="hue-line" cx="250" cy="176" rx="76" ry="16"/>
<line class="lead" x1="326" y1="182" x2="326" y2="346" stroke-dasharray="3 5"/>
<line class="stick" x1="250" y1="212" x2="294" y2="212"/><circle class="hue" cx="300" cy="212" r="14"/><ellipse class="halo" cx="300" cy="212" rx="22" ry="7"/>
<line class="stick" x1="250" y1="262" x2="336" y2="262"/><circle class="hue" cx="344" cy="262" r="9"/><ellipse class="halo" cx="344" cy="262" rx="12" ry="4" opacity="0.5"/>
<line class="stick" x1="250" y1="316" x2="274" y2="316" opacity="0.7"/><circle class="hue" cx="278" cy="316" r="4.5" opacity="0.7"/>
<line class="stick" x1="250" y1="340" x2="266" y2="340" opacity="0.5"/><circle class="hue" cx="269" cy="340" r="3.5" opacity="0.5"/>

<!-- the cap, its thickness, and the pale middle -->
<ellipse class="hue" cx="250" cy="130" rx="66" ry="14" opacity="0.65"/>
<ellipse class="hue" cx="250" cy="122" rx="66" ry="14"/>
<ellipse class="core" cx="250" cy="121" rx="27" ry="5.5"/>

<!-- labels to the right -->
<line class="lead" x1="314" y1="118" x2="452" y2="104"/>
<text class="ink" x="460" y="102">Cap — wider means more objects</text>
<text class="dim" x="460" y="120">pale middle: the part already on this machine</text>

<line class="lead" x1="326" y1="176" x2="452" y2="164"/>
<text class="ink" x="460" y="162">The one-year ring</text>
<text class="dim" x="460" y="180">as far out as an object a year old stands</text>

<line class="lead" x1="314" y1="212" x2="452" y2="216"/>
<text class="ink" x="460" y="214">A ball inside it</text>
<text class="dim" x="460" y="232">one of the 3 largest changed within the year</text>

<line class="lead" x1="353" y1="262" x2="452" y2="268"/>
<text class="ink" x="460" y="266">A ball outside it</text>
<text class="dim" x="460" y="284">one of the 3 largest untouched for a year: cold</text>

<path class="lead" d="M322,207 C 380,207 400,298 452,298" opacity="0.7"/>
<text class="ink" x="460" y="304">The halo round a ball</text>
<text class="dim" x="460" y="322">how often that one object has been opened</text>

<line class="lead" x1="284" y1="340" x2="452" y2="340"/>
<text class="dim" x="460" y="344">Small balls: the tail, placed by the real ages</text>

<line class="lead" x1="298" y1="372" x2="452" y2="372"/>
<text class="ink" x="460" y="370">The ring around the base: how much reading</text>
<text class="dim" x="460" y="388">all the way round is the busiest pole on the disc</text>
<rect x="460" y="398" width="10" height="10" rx="2" fill="#e3eaf3"/>
<text class="dim" x="476" y="407">a person</text>
<rect x="546" y="398" width="10" height="10" rx="2" fill="#e8b04b"/>
<text class="dim" x="562" y="407">an agent</text>

<!-- labels to the left -->
<line class="lead" x1="244" y1="146" x2="190" y2="146"/>
<text class="ink" x="20" y="142">Narrow top</text>
<text class="dim" x="20" y="160">one object is most of it</text>

<line class="lead" x1="242" y1="252" x2="190" y2="252"/>
<text class="ink" x="20" y="248">Height</text>
<text class="dim" x="20" y="266">the measure being compared</text>

<line class="lead" x1="238" y1="376" x2="190" y2="384"/>
<text class="ink" x="20" y="380">The base</text>
<text class="dim" x="20" y="398">where the root stands</text>
</svg>
